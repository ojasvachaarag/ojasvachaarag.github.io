<!--
    Page scaffold. Copy this to build a new top-level site page
    (like index.html or projects.html).

    Everything outside the "PAGE CONTENT" markers is shared boilerplate:
    nav, contact section, music player, and their scripts. Only the
    middle section is meant to change between pages.

    Steps to use:
      1. Copy this file to project root as <your-page>.html
      2. Set <title> and <meta name="keywords"> for the page
      3. Replace the PAGE CONTENT block with your content
      4. Add a nav link to it from index.html's <ul id="sidemenu">
-->
<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Ojasva Chaarag</title>
        <meta charset="UTF-8">
        <meta name = "keywords" content = "">
        <meta name = "author" content = "Ojasva Chaarag">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <noscript>Browser JavaScript not available.</noscript>
        <link rel = "stylesheet" href = "style.css">
        <script src="https://kit.fontawesome.com/f656d729fb.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div id = "header">
            <div class = "container">
                <nav>
                    <a href="index.html"><img src = "Assets/Images/logo.png" class = "logo"></a>
                    <ul id = "sidemenu">
                        <li><a href = "#contact">Contact</a></li>
                        <i class="fa-solid fa-circle-xmark" onclick = "closemenu()"></i>
                    </ul>
                    <i class="fa-solid fa-bars" id = "open-menu-button" onclick = "openmenu()"></i>
                </nav>
            </div>
        </div>

        <!-- ==================== PAGE CONTENT START ==================== -->

        <div class = "about" id = "about">
            <div class = "container">
                <div class = "row">
                    <div class = "about-col-2">
                        <h1 class = "sub-title">
                            Page Title
                        </h1>
                        <p>
                            Page content goes here.
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== PAGE CONTENT END ==================== -->

        <div id="contact">
            <div class="container">
                <div class="row">
                    <div class="contact-left">
                        <h1 class = "sub-title">Contact Me</h1>
                        <p><a href="mailto:ojasvachaarag@gmail.com"><i class="fa-solid fa-paper-plane"></i> ojasvachaarag@gmail.com</a></p>
                        <p><i class="fa-solid fa-mobile"></i>+91-7599339966</p>
                        <div class="social-icons">
                            <a href="https://github.com/Astraisaria"><i class="fa-brands fa-github"></i></a>
                            <a href="https://www.linkedin.com/in/ojasva-chaarag/"><i class="fa-brands fa-linkedin-in"></i></a>
                            <a href="https://www.instagram.com/ojasva_chaarag/"><i class="fa-brands fa-instagram"></i></a>
                        </div>
                        <a href="Assets/Ojasva Chaarag - CV.pdf" download class = "btn btn2">Download CV</a>
                    </div>
                    <div class="contact-right">
                        <form id="contact-form">
                            <input type = "text" id = "name" name = "Name" placeholder = "Your Name" required>
                            <input type = "email" id = "email" name = "E-mail" placeholder = "Your Email" required>
                            <textarea id = "message" name = "Message" rows = "6" placeholder = "Your Message"></textarea>
                            <button type = "submit" class = "btn btn2">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="copyright">
                <p>Copyright 2026 © Ojasva Chaarag</p>
            </div>
        </div>
        <div class="music-control">
            <button id="toggle-control"><i class="fa-solid fa-chevron-up"></i></button>
            <div class="control-content">
                <button id="prev-track"><i class="fa-solid fa-backward"></i></button>
                <button id="play-pause"><i class="fa-solid fa-play"></i></button>
                <button id="next-track"><i class="fa-solid fa-forward"></i></button>
                <p id="track-info">No track playing</p>
            </div>
            <input type="range" id="volume-control" min="0" max="1" step="0.1" value="0.5">
            <button id="mute-toggle"><i class="fa-solid fa-volume-up"></i></button>
        </div>

        <script>
            var sidemenu = document.getElementById("sidemenu");
            var openmenubutton = document.getElementById("open-menu-button");

            function openmenu(){
                sidemenu.style.right = "0";
                openmenubutton.style.display = "none";
            }

            function closemenu(){
                sidemenu.style.right = "-200px";
                openmenubutton.style.display = "block";
            }
        </script>

        <script>
            const form = document.getElementById('contact-form');

            form.addEventListener('submit', async function (e) {
              e.preventDefault();

              const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
              };

              const googleScriptURL = "https://script.google.com/macros/s/AKfycbwoxgq2ZALFJXVyZ9ViHJaOIvCzE6gmDKicu9M8ajD6Z9e4WWAb9qjYdu3RZLVgNS_aBw/exec";

              try {
                const response = await fetch(googleScriptURL, {
                  method: "POST",
                  mode: "no-cors",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify(formData)
                });

                alert("Message sent successfully!");
                form.reset();
              } catch (error) {
                alert("Error submitting form. Please try again.");
                console.error("Error:", error);
              }
            });
        </script>

        <script>
            const toggleButton = document.getElementById("toggle-control");
            const musicControl = document.querySelector(".music-control");

            toggleButton.addEventListener("click", () => {
                musicControl.classList.toggle("collapsed");

                if (musicControl.classList.contains("collapsed")) {
                    toggleButton.innerHTML = '<i class="fa-solid fa-chevron-down"></i>';
                } else {
                    toggleButton.innerHTML = '<i class="fa-solid fa-chevron-up"></i>';
                }
            });

            const tracks = [
                { src: "Assets/Music/Prism.mp3", title: "Prism - Theatre of Delays (Licence Code: UHJXLPIJE1BCMOSU)" },
                { src: "Assets/Music/Long-Night.mp3", title: "Long Night - Adventure (License code: GUEMOBY8XQ411ZBZ)" },
                { src: "Assets/Music/track3.mp3", title: "Refract - Diffie Bosman (License code: NVSCO4EWRXAYTYDU)" }
            ];

            const audio = new Audio();
            let currentTrackIndex = 0;

            const playPauseButton = document.getElementById("play-pause");
            const nextButton = document.getElementById("next-track");
            const prevButton = document.getElementById("prev-track");
            const volumeControl = document.getElementById("volume-control");
            const muteButton = document.getElementById("mute-toggle");
            const trackInfo = document.getElementById("track-info");

            function loadTrack(index) {
                audio.src = tracks[index].src;
                trackInfo.textContent = tracks[index].title;
                audio.play();
                playPauseButton.innerHTML = '<i class="fa-solid fa-pause"></i>';
            }

            playPauseButton.addEventListener("click", () => {
                if (audio.paused) {
                    audio.play();
                    playPauseButton.innerHTML = '<i class="fa-solid fa-pause"></i>';
                } else {
                    audio.pause();
                    playPauseButton.innerHTML = '<i class="fa-solid fa-play"></i>';
                }
            });

            nextButton.addEventListener("click", () => {
                currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
                loadTrack(currentTrackIndex);
            });

            prevButton.addEventListener("click", () => {
                currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
                loadTrack(currentTrackIndex);
            });

            volumeControl.addEventListener("input", () => {
                audio.volume = volumeControl.value;
            });

            muteButton.addEventListener("click", () => {
                if (audio.muted) {
                    audio.muted = false;
                    muteButton.innerHTML = '<i class="fa-solid fa-volume-up"></i>';
                } else {
                    audio.muted = true;
                    muteButton.innerHTML = '<i class="fa-solid fa-volume-mute"></i>';
                }
            });

            window.addEventListener("load", () => loadTrack(currentTrackIndex));
        </script>
    </body>
</html>
