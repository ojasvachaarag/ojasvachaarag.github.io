        <div id="workspace-shell">

            <aside id="workspace-sidebar">

                <h2>Applications</h2>

                <!--
                    Sidebar buttons are rendered from the `apps` registry
                    in the script below — see renderSidebar(). To add a
                    new app: add an entry to `apps`, drop its HTML partial
                    in synaptiq_apps/, and it shows up here automatically.
                -->
                <div id="app-buttons"></div>

            </aside>

            <main id="workspace-main">

                <h1>SynaptIQ Workspace</h1>

                <div id="app-container">
                    <p>Select an application.</p>
                </div>

            </main>

        </div>

        <script>
            // Registry of available canvas apps.
            // key   -> used internally and as the partial's filename (synaptiq_apps/<key>.html)
            // label -> text shown on the sidebar button
            // init  -> optional function run right after the partial is injected
            //          (use this to wire up state that plain onclick="" can't cover)
            const apps = {
                "synaptiq-rag": {
                    label: "Chat with Documents",
                    file: "synaptiq_apps/synaptiq-rag.html",
                    init: null
                }
                // Add more apps here, e.g.:
                // "another-app": { label: "Another Tool", file: "synaptiq_apps/another-app.html", init: null }
            };

            function renderSidebar(){
                const container = document.getElementById("app-buttons");
                container.innerHTML = "";

                for (const key in apps){
                    const btn = document.createElement("button");
                    btn.textContent = apps[key].label;
                    btn.onclick = () => loadApp(key);
                    container.appendChild(btn);
                }
            }

            async function loadApp(appKey){
                const app = apps[appKey];
                const appContainer = document.getElementById("app-container");

                if (!app){
                    appContainer.innerHTML = `<p>Unknown application: ${appKey}</p>`;
                    return;
                }

                appContainer.innerHTML = "<p>Loading...</p>";

                try {
                    const response = await fetch(app.file);

                    if (!response.ok){
                        throw new Error(`Failed to load ${app.file} (${response.status})`);
                    }

                    const html = await response.text();
                    appContainer.innerHTML = html;

                    if (typeof app.init === "function"){
                        app.init();
                    }

                } catch (error){
                    appContainer.innerHTML = "<p>Couldn't load this application.</p>";
                    console.error(error);
                }
            }

            renderSidebar();
        </script>

        <script>
            // Used by the injected synaptiq-rag.html partial (its Send
            // button calls startJob() directly via inline onclick).
            async function startJob(){

                try{

                    const promptField = document.getElementById("prompt-input");
                    const statusField = document.getElementById("job-status");

                    if (!promptField || !statusField) return;

                    const prompt = promptField.value;
                    statusField.innerText = "Starting...";

                    const response = await fetch(
                        "https://YOUR-RENDER-URL.onrender.com/start-job",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ prompt })
                        }
                    );

                    const data = await response.json();
                    pollJob(data.jobId);

                }catch(error){

                    const statusField = document.getElementById("job-status");
                    if (statusField) statusField.innerText = "Server offline.";

                    console.error(error);
                }
            }

            function pollJob(jobId){

                const interval = setInterval(async () => {

                    try {
                        const response = await fetch(
                            `https://YOUR-RENDER-URL.onrender.com/job/${jobId}`
                        );

                        const data = await response.json();
                        const statusField = document.getElementById("job-status");

                        if (!statusField){
                            clearInterval(interval);
                            return;
                        }

                        statusField.innerText = data.status;

                        if (data.status === "completed"){
                            clearInterval(interval);
                            statusField.innerText = data.result;
                        }

                    } catch (error){
                        clearInterval(interval);
                        console.error(error);
                    }

                }, 2000);
            }
        </script>

        <script>
            const toggleButton = document.getElementById("toggle-control");
            const musicControl = document.querySelector(".music-control");

            toggleButton.addEventListener("click", () => {
                musicControl.classList.toggle("collapsed");

                if (musicControl.classList.contains("collapsed")) {
                    toggleButton.innerHTML = '<i class="fa-solid fa-chevron-down"></i>';
                } else {
                    toggleButton.innerHTML = '<i class="fa-solid fa-chevron-up"></i>';
                }
            });

            const tracks = [
                { src: "Assets/Music/Prism.mp3", title: "Prism - Theatre of Delays (Licence Code: UHJXLPIJE1BCMOSU)" },
                { src: "Assets/Music/Long-Night.mp3", title: "Long Night - Adventure (License code: GUEMOBY8XQ411ZBZ)" },
                { src: "Assets/Music/track3.mp3", title: "Refract - Diffie Bosman (License code: NVSCO4EWRXAYTYDU)" }
            ];

            const audio = new Audio();
            let currentTrackIndex = 0;

            const playPauseButton = document.getElementById("play-pause");
            const nextButton = document.getElementById("next-track");
            const prevButton = document.getElementById("prev-track");
            const volumeControl = document.getElementById("volume-control");
            const muteButton = document.getElementById("mute-toggle");
            const trackInfo = document.getElementById("track-info");

            function loadTrack(index) {
                audio.src = tracks[index].src;
                trackInfo.textContent = tracks[index].title;
                audio.play();
                playPauseButton.innerHTML = '<i class="fa-solid fa-pause"></i>';
            }

            playPauseButton.addEventListener("click", () => {
                if (audio.paused) {
                    audio.play();
                    playPauseButton.innerHTML = '<i class="fa-solid fa-pause"></i>';
                } else {
                    audio.pause();
                    playPauseButton.innerHTML = '<i class="fa-solid fa-play"></i>';
                }
            });

            nextButton.addEventListener("click", () => {
                currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
                loadTrack(currentTrackIndex);
            });

            prevButton.addEventListener("click", () => {
                currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
                loadTrack(currentTrackIndex);
            });

            volumeControl.addEventListener("input", () => {
                audio.volume = volumeControl.value;
            });

            muteButton.addEventListener("click", () => {
                if (audio.muted) {
                    audio.muted = false;
                    muteButton.innerHTML = '<i class="fa-solid fa-volume-up"></i>';
                } else {
                    audio.muted = true;
                    muteButton.innerHTML = '<i class="fa-solid fa-volume-mute"></i>';
                }
            });

            window.addEventListener("load", () => loadTrack(currentTrackIndex));
        </script>
