<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Contact Submissions | Ojasva Chaarag</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/f656d729fb.js" crossorigin="anonymous"></script>
        <style>
            .submissions-page {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background-color: #1d3557;
                color: #f1faee;
            }

            .sub-header {
                padding: 20px 0;
                background: rgba(15, 28, 46, 0.7);
                backdrop-filter: blur(8px);
                border-bottom: 1px solid rgba(168, 218, 220, 0.15);
            }

            .main-content {
                flex: 1;
                padding: 40px 0 80px 0;
            }

            .auth-card {
                max-width: 460px;
                margin: 40px auto;
                background: rgba(29, 53, 87, 0.85);
                border: 1px solid rgba(168, 218, 220, 0.25);
                border-radius: 16px;
                padding: 35px 30px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
                text-align: center;
            }

            .auth-icon {
                font-size: 42px;
                color: #e63946;
                margin-bottom: 15px;
            }

            .auth-card h2 {
                font-size: 26px;
                margin-bottom: 10px;
                color: #f1faee;
            }

            .auth-card p {
                color: #a8dadc;
                font-size: 14px;
                margin-bottom: 25px;
                line-height: 1.5;
            }

            .form-group {
                margin-bottom: 20px;
                text-align: left;
                position: relative;
            }

            .form-group label {
                display: block;
                font-size: 13px;
                color: #a8dadc;
                margin-bottom: 8px;
                font-weight: 500;
            }

            .input-wrapper {
                position: relative;
            }

            .input-wrapper input {
                width: 100%;
                border: 1px solid rgba(168, 218, 220, 0.3);
                outline: none;
                background: #15263f;
                padding: 13px 45px 13px 15px;
                border-radius: 8px;
                color: #f1faee;
                font-size: 15px;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            .input-wrapper input:focus {
                border-color: #e63946;
                box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.25);
            }

            .password-toggle {
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: #a8dadc;
                cursor: pointer;
                user-select: none;
            }

            .alert {
                padding: 12px 16px;
                border-radius: 8px;
                font-size: 13px;
                margin-bottom: 20px;
                text-align: left;
                display: none;
                line-height: 1.4;
            }

            .alert-error {
                background: rgba(230, 57, 70, 0.15);
                border: 1px solid #e63946;
                color: #ff858d;
            }

            .alert-success {
                background: rgba(42, 157, 143, 0.2);
                border: 1px solid #2a9d8f;
                color: #48cae4;
            }

            .alert-info {
                background: rgba(168, 218, 220, 0.15);
                border: 1px solid #a8dadc;
                color: #f1faee;
            }

            .action-btn {
                width: 100%;
                padding: 13px;
                background: #e63946;
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s, transform 0.1s;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .action-btn:hover {
                background: #d62828;
            }

            .action-btn:active {
                transform: scale(0.98);
            }

            .btn-secondary {
                background: transparent;
                border: 1px solid rgba(168, 218, 220, 0.4);
                color: #f1faee;
            }

            .btn-secondary:hover {
                background: rgba(168, 218, 220, 0.1);
                border-color: #a8dadc;
            }

            .bootstrap-box {
                margin-top: 25px;
                padding-top: 20px;
                border-top: 1px solid rgba(168, 218, 220, 0.15);
                font-size: 13px;
            }

            .bootstrap-box p {
                margin-bottom: 12px;
                color: #a8dadc;
            }

            .link-btn {
                background: none;
                border: none;
                color: #e63946;
                text-decoration: underline;
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                padding: 0;
            }

            .link-btn:hover {
                color: #ff858d;
            }

            /* Dashboard Toolbar */
            .dashboard-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 15px;
                margin-bottom: 25px;
                padding-bottom: 20px;
                border-bottom: 1px solid rgba(168, 218, 220, 0.2);
            }

            .dashboard-title {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .dashboard-title h1 {
                font-size: 28px;
                color: #f1faee;
            }

            .badge {
                background: #2a9d8f;
                color: #f1faee;
                font-size: 13px;
                font-weight: 600;
                padding: 4px 12px;
                border-radius: 20px;
            }

            .dashboard-controls {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }

            .control-btn {
                padding: 9px 18px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: rgba(168, 218, 220, 0.12);
                color: #f1faee;
                border: 1px solid rgba(168, 218, 220, 0.25);
                transition: all 0.2s;
            }

            .control-btn:hover {
                background: rgba(168, 218, 220, 0.22);
            }

            .control-btn.btn-modify-pwd {
                background: #2a9d8f;
                border-color: #2a9d8f;
            }

            .control-btn.btn-modify-pwd:hover {
                background: #21867a;
            }

            .control-btn.btn-lock {
                background: rgba(230, 57, 70, 0.2);
                border-color: #e63946;
                color: #ff858d;
            }

            .control-btn.btn-lock:hover {
                background: #e63946;
                color: #fff;
            }

            .search-bar {
                margin-bottom: 25px;
                display: flex;
                gap: 10px;
            }

            .search-bar input {
                flex: 1;
                border: 1px solid rgba(168, 218, 220, 0.2);
                outline: none;
                background: rgba(15, 28, 46, 0.6);
                padding: 12px 18px;
                border-radius: 8px;
                color: #f1faee;
                font-size: 14px;
            }

            .search-bar input:focus {
                border-color: #2a9d8f;
            }

            /* Submissions Cards */
            .submissions-list {
                display: grid;
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .submission-card {
                background: rgba(21, 38, 63, 0.7);
                border: 1px solid rgba(168, 218, 220, 0.18);
                border-radius: 12px;
                padding: 22px;
                transition: transform 0.2s, box-shadow 0.2s;
                position: relative;
            }

            .submission-card:hover {
                border-color: rgba(168, 218, 220, 0.4);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            }

            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                flex-wrap: wrap;
                gap: 10px;
                margin-bottom: 14px;
            }

            .sender-info h3 {
                font-size: 19px;
                color: #f1faee;
                margin-bottom: 4px;
            }

            .sender-email {
                color: #a8dadc;
                font-size: 14px;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                transition: color 0.2s;
            }

            .sender-email:hover {
                color: #e63946;
            }

            .meta-info {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .timestamp {
                font-size: 13px;
                color: #a8dadc;
                opacity: 0.8;
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }

            .card-message {
                background: rgba(15, 28, 46, 0.55);
                border-left: 3px solid #2a9d8f;
                padding: 14px 18px;
                border-radius: 0 8px 8px 0;
                font-size: 14px;
                line-height: 1.6;
                color: #f1faee;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .card-actions {
                margin-top: 14px;
                display: flex;
                justify-content: flex-end;
            }

            .delete-btn {
                background: transparent;
                border: 1px solid rgba(230, 57, 70, 0.3);
                color: #ff858d;
                padding: 6px 14px;
                border-radius: 6px;
                font-size: 12px;
                cursor: pointer;
                transition: all 0.2s;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .delete-btn:hover {
                background: #e63946;
                color: #fff;
                border-color: #e63946;
            }

            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #a8dadc;
            }

            .empty-state i {
                font-size: 48px;
                margin-bottom: 15px;
                color: rgba(168, 218, 220, 0.4);
            }

            .empty-state h3 {
                font-size: 20px;
                color: #f1faee;
                margin-bottom: 8px;
            }

            /* Modal */
            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(4px);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                padding: 20px;
            }

            .modal-content {
                background: #1d3557;
                border: 1px solid rgba(168, 218, 220, 0.3);
                border-radius: 14px;
                max-width: 440px;
                width: 100%;
                padding: 30px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
                position: relative;
            }

            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            }

            .modal-header h3 {
                font-size: 20px;
                color: #f1faee;
            }

            .close-modal-btn {
                background: none;
                border: none;
                color: #a8dadc;
                font-size: 20px;
                cursor: pointer;
            }

            .close-modal-btn:hover {
                color: #e63946;
            }

            .modal-actions {
                display: flex;
                gap: 10px;
                margin-top: 20px;
            }

            .modal-actions button {
                flex: 1;
            }

            .server-config-toggle {
                margin-top: 15px;
                font-size: 12px;
                color: #a8dadc;
                cursor: pointer;
                text-decoration: underline;
                display: inline-block;
            }
        </style>
    </head>
    <body class="submissions-page">
        <!-- Navigation -->
        <header class="sub-header">
            <div class="container">
                <nav>
                    <a href="index.html"><img src="Assets/Images/logo.png" class="logo" alt="Logo"></a>
                    <ul id="sidemenu">
                        <li><a href="index.html">Portfolio</a></li>
                        <li><a href="projects.html">Projects</a></li>
                        <li><a href="index.html#contact">Contact</a></li>
                        <i class="fa-solid fa-circle-xmark" onclick="closemenu()"></i>
                    </ul>
                    <i class="fa-solid fa-bars" id="open-menu-button" onclick="openmenu()"></i>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <!-- Section 1: Locked / Login Screen -->
                <div id="login-view" class="auth-card">
                    <div class="auth-icon">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h2>Protected Submissions</h2>
                    <p>Enter the page password to view contact form submissions received on your portfolio.</p>

                    <div id="login-alert" class="alert"></div>

                    <form id="login-form">
                        <div class="form-group">
                            <label for="page-password">Page Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="page-password" placeholder="Enter password" required autocomplete="current-password">
                                <i class="fa-solid fa-eye password-toggle" onclick="togglePasswordVisibility('page-password', this)"></i>
                            </div>
                        </div>

                        <button type="submit" id="unlock-btn" class="action-btn">
                            <i class="fa-solid fa-unlock"></i> Unlock Submissions
                        </button>
                    </form>

                    <div class="bootstrap-box">
                        <p id="bootstrap-status-text">First time here? Bootstrap initial default password.</p>
                        <button type="button" id="bootstrap-btn" class="link-btn" onclick="bootstrapPassword()">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Bootstrap Default Password ('password123')
                        </button>
                    </div>

                    <div style="margin-top: 15px;">
                        <span class="server-config-toggle" onclick="toggleServerConfig()">
                            <i class="fa-solid fa-gear"></i> Configure API URL
                        </span>
                        <div id="server-config-box" style="display: none; margin-top: 10px; text-align: left;">
                            <label style="font-size: 12px; color: #a8dadc;">API Base URL:</label>
                            <input type="text" id="api-base-input" style="width: 100%; padding: 8px; font-size: 13px; background: #15263f; border: 1px solid rgba(168,218,220,0.3); border-radius: 6px; color: #fff; margin-top: 4px;" value="http://localhost:8000">
                            <button type="button" class="action-btn btn-secondary" style="padding: 6px 12px; font-size: 12px; margin-top: 6px; width: auto;" onclick="saveApiBaseUrl()">Save URL</button>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Authenticated Submissions Dashboard -->
                <div id="dashboard-view" style="display: none;">
                    <div class="dashboard-header">
                        <div class="dashboard-title">
                            <h1>Contact Submissions</h1>
                            <span id="submissions-count" class="badge">0 Messages</span>
                        </div>
                        <div class="dashboard-controls">
                            <button type="button" class="control-btn" onclick="loadSubmissions()">
                                <i class="fa-solid fa-rotate-right"></i> Refresh
                            </button>
                            <button type="button" class="control-btn btn-modify-pwd" onclick="openModifyPasswordModal()">
                                <i class="fa-solid fa-key"></i> Modify Password
                            </button>
                            <button type="button" class="control-btn btn-lock" onclick="logout()">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i> Lock Page
                            </button>
                        </div>
                    </div>

                    <div id="dashboard-alert" class="alert"></div>

                    <div class="search-bar">
                        <input type="text" id="submissions-search" placeholder="Search submissions by sender name, email, or message keyword..." oninput="filterSubmissions()">
                    </div>

                    <div id="submissions-container" class="submissions-list">
                        <!-- Submissions injected dynamically -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Modify Password Modal -->
        <div id="modify-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Modify Page Password</h3>
                    <button type="button" class="close-modal-btn" onclick="closeModifyPasswordModal()">&times;</button>
                </div>

                <div id="modal-alert" class="alert"></div>

                <form id="modify-password-form" onsubmit="handleModifyPassword(event)">
                    <div class="form-group">
                        <label for="current-password">Current Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="current-password" placeholder="Enter current password" required autocomplete="current-password">
                            <i class="fa-solid fa-eye password-toggle" onclick="togglePasswordVisibility('current-password', this)"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="new-password">New Password (min 6 characters)</label>
                        <div class="input-wrapper">
                            <input type="password" id="new-password" placeholder="Enter new password" minlength="6" required autocomplete="new-password">
                            <i class="fa-solid fa-eye password-toggle" onclick="togglePasswordVisibility('new-password', this)"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirm-password" placeholder="Confirm new password" minlength="6" required autocomplete="new-password">
                            <i class="fa-solid fa-eye password-toggle" onclick="togglePasswordVisibility('confirm-password', this)"></i>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="action-btn btn-secondary" onclick="closeModifyPasswordModal()">Cancel</button>
                        <button type="submit" id="save-password-btn" class="action-btn">Update Password</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            // State
            let allSubmissions = [];
            const STORAGE_TOKEN_KEY = "ojasva_submissions_token";
            const STORAGE_API_BASE = "ojasva_api_base";

            function getApiBaseUrl() {
                const stored = localStorage.getItem(STORAGE_API_BASE);
                if (stored) return stored.replace(/\/+$/, "");
                if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                    return "http://localhost:8000";
                }
                return "http://localhost:8000";
            }

            function saveApiBaseUrl() {
                const val = document.getElementById("api-base-input").value.trim();
                if (val) {
                    localStorage.setItem(STORAGE_API_BASE, val);
                    showAlert("login-alert", `API base set to: ${val}`, "success");
                    checkStatus();
                }
            }

            function toggleServerConfig() {
                const box = document.getElementById("server-config-box");
                box.style.display = box.style.display === "none" ? "block" : "none";
            }

            function showAlert(elementId, message, type = "error") {
                const el = document.getElementById(elementId);
                if (!el) return;
                el.className = `alert alert-${type}`;
                el.textContent = message;
                el.style.display = "block";
            }

            function hideAlert(elementId) {
                const el = document.getElementById(elementId);
                if (el) el.style.display = "none";
            }

            function togglePasswordVisibility(inputId, icon) {
                const input = document.getElementById(inputId);
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                } else {
                    input.type = "password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                }
            }

            // Universal API request helper
            async function apiFetch(endpoint, options = {}) {
                const base = getApiBaseUrl();
                const url = endpoint.startsWith("http") ? endpoint : `${base}/${endpoint.replace(/^\/+/, "")}`;
                const headers = {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                };

                const token = sessionStorage.getItem(STORAGE_TOKEN_KEY);
                if (token && !headers["Authorization"] && !headers["X-Page-Password"]) {
                    headers["Authorization"] = `Bearer ${token}`;
                }

                const res = await fetch(url, { ...options, headers });
                let data = null;
                try {
                    data = await res.json();
                } catch (_) {}

                if (!res.ok) {
                    let errMsg = `Request failed (${res.status})`;
                    if (data && data.error && data.error.message) {
                        errMsg = data.error.message;
                    } else if (data && data.message) {
                        errMsg = data.message;
                    } else if (data && data.detail) {
                        errMsg = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
                    }
                    const err = new Error(errMsg);
                    err.status = res.status;
                    err.code = (data && data.error && data.error.code) || null;
                    throw err;
                }
                return data;
            }

            // Status check
            async function checkStatus() {
                try {
                    const status = await apiFetch("/api/v1/ojasvachaarag/status");
                    const statusText = document.getElementById("bootstrap-status-text");
                    const bootstrapBtn = document.getElementById("bootstrap-btn");
                    if (status && status.is_bootstrapped) {
                        statusText.textContent = "Page password is initialized.";
                        bootstrapBtn.style.display = "none";
                    } else {
                        statusText.textContent = "Page password is not set yet. Click below to bootstrap:";
                        bootstrapBtn.style.display = "inline-block";
                    }
                } catch (err) {
                    console.warn("Could not check auth status:", err);
                }
            }

            // Bootstrap password route
            async function bootstrapPassword() {
                hideAlert("login-alert");
                try {
                    const res = await apiFetch("/api/v1/ojasvachaarag/bootstrap", { method: "POST" });
                    showAlert("login-alert", res.message || "Password bootstrapped to 'password123'. You can now sign in.", "success");
                    document.getElementById("page-password").value = "password123";
                    checkStatus();
                } catch (err) {
                    showAlert("login-alert", err.message || "Failed to bootstrap password.", "error");
                }
            }

            // Login / Unlock
            document.getElementById("login-form").addEventListener("submit", async function(e) {
                e.preventDefault();
                hideAlert("login-alert");
                const password = document.getElementById("page-password").value.trim();
                if (!password) return;

                const unlockBtn = document.getElementById("unlock-btn");
                unlockBtn.disabled = true;
                unlockBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

                try {
                    const res = await apiFetch("/api/v1/ojasvachaarag/verify", {
                        method: "POST",
                        body: JSON.stringify({ password })
                    });

                    if (res.valid && res.token) {
                        sessionStorage.setItem(STORAGE_TOKEN_KEY, res.token);
                        // Also cache password for easy modify password flow if desired
                        showDashboard();
                    } else {
                        showAlert("login-alert", "Invalid credentials.", "error");
                    }
                } catch (err) {
                    showAlert("login-alert", err.message || "Authentication failed. Please check password.", "error");
                } finally {
                    unlockBtn.disabled = false;
                    unlockBtn.innerHTML = '<i class="fa-solid fa-unlock"></i> Unlock Submissions';
                }
            });

            function showDashboard() {
                document.getElementById("login-view").style.display = "none";
                document.getElementById("dashboard-view").style.display = "block";
                loadSubmissions();
            }

            function logout() {
                sessionStorage.removeItem(STORAGE_TOKEN_KEY);
                document.getElementById("dashboard-view").style.display = "none";
                document.getElementById("login-view").style.display = "block";
                document.getElementById("page-password").value = "";
                hideAlert("login-alert");
                checkStatus();
            }

            // Load Submissions
            async function loadSubmissions() {
                hideAlert("dashboard-alert");
                const container = document.getElementById("submissions-container");
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading contact form submissions...</p></div>';

                try {
                    const submissions = await apiFetch("/api/v1/ojasvachaarag/submissions");
                    allSubmissions = submissions || [];
                    renderSubmissions(allSubmissions);
                } catch (err) {
                    if (err.status === 401) {
                        logout();
                        showAlert("login-alert", "Session expired or invalid. Please sign in again.", "error");
                    } else {
                        showAlert("dashboard-alert", `Failed to load submissions: ${err.message}`, "error");
                        container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load submissions.</p></div>';
                    }
                }
            }

            function renderSubmissions(list) {
                const container = document.getElementById("submissions-container");
                const countBadge = document.getElementById("submissions-count");
                countBadge.textContent = `${list.length} ${list.length === 1 ? 'Message' : 'Messages'}`;

                if (!list || list.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-inbox"></i>
                            <h3>No Submissions Found</h3>
                            <p>Contact form entries submitted from your portfolio will appear here.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = list.map(sub => {
                    const dateObj = new Date(sub.created_at);
                    const formattedDate = dateObj.toLocaleDateString(undefined, {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    return `
                        <div class="submission-card" id="card-${sub.id}">
                            <div class="card-header">
                                <div class="sender-info">
                                    <h3>${escapeHtml(sub.name)}</h3>
                                    <a href="mailto:${escapeHtml(sub.email)}" class="sender-email">
                                        <i class="fa-solid fa-envelope"></i> ${escapeHtml(sub.email)}
                                    </a>
                                </div>
                                <div class="meta-info">
                                    <span class="timestamp">
                                        <i class="fa-regular fa-clock"></i> ${formattedDate}
                                    </span>
                                </div>
                            </div>
                            <div class="card-message">${escapeHtml(sub.message)}</div>
                            <div class="card-actions">
                                <button type="button" class="delete-btn" onclick="deleteSubmission('${sub.id}')">
                                    <i class="fa-solid fa-trash-can"></i> Delete
                                </button>
                            </div>
                        </div>
                    `;
                }).join("");
            }

            function filterSubmissions() {
                const query = document.getElementById("submissions-search").value.trim().toLowerCase();
                if (!query) {
                    renderSubmissions(allSubmissions);
                    return;
                }
                const filtered = allSubmissions.filter(sub =>
                    sub.name.toLowerCase().includes(query) ||
                    sub.email.toLowerCase().includes(query) ||
                    sub.message.toLowerCase().includes(query)
                );
                renderSubmissions(filtered);
            }

            async function deleteSubmission(id) {
                if (!confirm("Are you sure you want to delete this submission?")) return;

                try {
                    await apiFetch(`/api/v1/ojasvachaarag/submissions/${id}`, { method: "DELETE" });
                    allSubmissions = allSubmissions.filter(s => s.id !== id);
                    renderSubmissions(allSubmissions);
                    showAlert("dashboard-alert", "Submission deleted successfully.", "success");
                    setTimeout(() => hideAlert("dashboard-alert"), 3000);
                } catch (err) {
                    alert(`Failed to delete: ${err.message}`);
                }
            }

            // Modify Password Modal
            function openModifyPasswordModal() {
                hideAlert("modal-alert");
                document.getElementById("current-password").value = "";
                document.getElementById("new-password").value = "";
                document.getElementById("confirm-password").value = "";
                document.getElementById("modify-modal").style.display = "flex";
            }

            function closeModifyPasswordModal() {
                document.getElementById("modify-modal").style.display = "none";
            }

            async function handleModifyPassword(e) {
                e.preventDefault();
                hideAlert("modal-alert");

                const currentPassword = document.getElementById("current-password").value.trim();
                const newPassword = document.getElementById("new-password").value.trim();
                const confirmPassword = document.getElementById("confirm-password").value.trim();

                if (newPassword !== confirmPassword) {
                    showAlert("modal-alert", "New password and confirmation do not match.", "error");
                    return;
                }

                if (newPassword.length < 6) {
                    showAlert("modal-alert", "New password must be at least 6 characters long.", "error");
                    return;
                }

                const btn = document.getElementById("save-password-btn");
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';

                try {
                    const res = await apiFetch("/api/v1/ojasvachaarag/modify-password", {
                        method: "POST",
                        body: JSON.stringify({
                            current_password: currentPassword,
                            new_password: newPassword
                        })
                    });

                    // Re-authenticate to update token with new password
                    const verifyRes = await apiFetch("/api/v1/ojasvachaarag/verify", {
                        method: "POST",
                        body: JSON.stringify({ password: newPassword })
                    });
                    if (verifyRes && verifyRes.token) {
                        sessionStorage.setItem(STORAGE_TOKEN_KEY, verifyRes.token);
                    }

                    closeModifyPasswordModal();
                    showAlert("dashboard-alert", res.message || "Password updated successfully!", "success");
                    setTimeout(() => hideAlert("dashboard-alert"), 4000);
                } catch (err) {
                    showAlert("modal-alert", err.message || "Failed to update password.", "error");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'Update Password';
                }
            }

            function escapeHtml(str) {
                if (!str) return "";
                const div = document.createElement("div");
                div.textContent = str;
                return div.innerHTML;
            }

            // Mobile menu handlers
            const sidemenu = document.getElementById("sidemenu");
            function openmenu() { if (sidemenu) sidemenu.style.right = "0"; }
            function closemenu() { if (sidemenu) sidemenu.style.right = "-200px"; }

            // Initialize
            document.addEventListener("DOMContentLoaded", () => {
                const apiInput = document.getElementById("api-base-input");
                if (apiInput) apiInput.value = getApiBaseUrl();

                checkStatus();

                // If already logged in this session
                const token = sessionStorage.getItem(STORAGE_TOKEN_KEY);
                if (token) {
                    showDashboard();
                }
            });
        </script>
    </body>
</html>
